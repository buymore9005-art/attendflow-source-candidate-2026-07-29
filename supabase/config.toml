project_id = "attendance-payroll-system"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**"]
jwt_expiry = 3600
enable_signup = false

[storage]
enabled = true
file_size_limit = "50MiB"

[functions.adms]
verify_jwt = false

[functions.device-command]
verify_jwt = true

[functions.deli-sync]
verify_jwt = false

[functions.admin-users]
verify_jwt = true

[functions.backup-restore]
verify_jwt = true

[functions.scheduled-maintenance]
verify_jwt = false
